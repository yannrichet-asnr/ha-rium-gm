name: Release

# Deux déclencheurs :
# - push d'un tag vX.Y.Z ;
# - lancement manuel (Actions > Release > Run workflow) : le tag v<version du
#   manifeste> est créé sur le commit courant de la branche choisie.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version et cohérence tag / manifeste
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/rium_gm/manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$manifest" ] || { echo "::error::tag $GITHUB_REF_NAME != version du manifeste $manifest"; exit 1; }
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"

      - name: Notes de version (section du CHANGELOG)
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::section $VERSION absente du CHANGELOG"; exit 1; }

      - name: Archive de l'intégration
        run: cd custom_components/rium_gm && zip -r "$GITHUB_WORKSPACE/rium_gm.zip" . -x '__pycache__/*'

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::la release v$VERSION existe déjà : incrémenter la version du manifeste"; exit 1
          fi
          gh release create "v$VERSION" rium_gm.zip --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
